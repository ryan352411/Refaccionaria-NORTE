<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Corte de Caja</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css?v=3">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">RefaxManager</p>
        <h1>Corte de Caja</h1>
      </div>
      <button class="icon-button" id="refreshButton" type="button" aria-label="Actualizar">
        <span aria-hidden="true">↻</span>
      </button>
    </header>

    <main>
      <section class="toolbar" aria-label="Filtros de corte">
        <label class="field">
          <span>Fecha</span>
          <input id="dateInput" type="date">
        </label>
        <div class="status-pill" id="connectionStatus">Conectando</div>
      </section>

      <section class="summary-grid" aria-label="Resumen de ventas">
        <article class="summary-card accent-green">
          <span class="label">Día</span>
          <strong id="daySales">$0.00</strong>
          <small id="dayMeta">0 tickets</small>
        </article>
        <article class="summary-card accent-blue">
          <span class="label">Mes</span>
          <strong id="monthSales">$0.00</strong>
          <small id="monthMeta">0 tickets</small>
        </article>
        <article class="summary-card accent-slate">
          <span class="label">Año</span>
          <strong id="yearSales">$0.00</strong>
          <small id="yearMeta">0 tickets</small>
        </article>
      </section>

      <section class="panel totals-panel" aria-label="Utilidad del día">
        <div>
          <span class="label">Inversión</span>
          <strong id="dayCost">$0.00</strong>
        </div>
        <div>
          <span class="label">Utilidad</span>
          <strong id="dayProfit">$0.00</strong>
        </div>
        <div>
          <span class="label">Esperado en caja</span>
          <strong id="expectedCash">$0.00</strong>
        </div>
      </section>

      <section class="panel" aria-label="Desglose por origen">
        <div class="section-title">
          <h2>Origen del día</h2>
          <span id="originCount">0</span>
        </div>
        <div class="origin-list" id="originList"></div>
      </section>

      <section class="panel" aria-label="Registrar cierre">
        <div class="section-title">
          <h2>Registrar cierre</h2>
          <span id="differenceBadge">$0.00</span>
        </div>

        <div class="form-grid">
          <label class="field wide">
            <span>Responsable</span>
            <input id="responsibleInput" type="text" autocomplete="name" placeholder="Nombre">
          </label>
          <label class="field">
            <span>Fondo inicial</span>
            <input id="openingCashInput" type="number" inputmode="decimal" min="0" step="0.01" value="0">
          </label>
          <label class="field">
            <span>Retiros</span>
            <input id="withdrawalsInput" type="number" inputmode="decimal" min="0" step="0.01" value="0">
          </label>
        </div>

        <div class="denomination-list" id="denominationList"></div>

        <label class="field wide">
          <span>Notas</span>
          <textarea id="notesInput" rows="3" placeholder="Ej. cambio pendiente, retiro a banco, vale interno"></textarea>
        </label>

        <div class="closing-bar">
          <div>
            <span class="label">Efectivo contado</span>
            <strong id="countedCash">$0.00</strong>
          </div>
          <button class="primary-button" id="saveButton" type="button">Guardar corte</button>
        </div>
      </section>

      <section class="panel last-close" id="lastClosePanel" hidden>
        <span class="label">Último cierre guardado</span>
        <strong id="lastCloseTitle"></strong>
        <small id="lastCloseDetail"></small>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js?v=3" type="module"></script>
</body>
</html>
